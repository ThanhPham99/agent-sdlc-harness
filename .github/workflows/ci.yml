name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A superseded push's run was burning a 2-job matrix plus a Windows runner to
# completion for no reason once a newer push existed for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Full offline gate. node 18 is the floor declared by package.json engines and
  # docs/INSTALLATION.md, so it is tested rather than assumed.
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Step order is generated from the `check` chain: qualification needs the
      # packages `build` produces, and scripts/validate-ci-coverage.mjs asserts
      # both membership and order so this cannot drift again.
      - name: Deterministic regression
        run: npm test
      - name: Integrity gates (versions, registry, root sync, host guard, CI coverage, CLI surface)
        run: npm run test:integrity
      - name: Auto-activation contract and per-host bootstrap hooks
        run: npm run test:activation
      - name: Design and plan-quality gates
        run: npm run test:gates
      - name: Task execution engine
        run: npm run test:tasks
      - name: Repository intelligence, traceability, delivery, governance, learning
        run: npm run test:alpha6
      - name: Build provider distributions
        run: npm run build
      - name: Validate GitHub-native install surfaces
        run: npm run validate:github
      - name: Test bootstrap installers with fake host CLIs
        run: npm run test:github-installers
      - name: Qualification harness contract
        run: npm run test:qualification-harness
      - name: Qualification transport contract (needs the built packages)
        run: npm run test:qualification-transport
      - name: CLI contract (spawned binary, agent-facing surface)
        run: npm run test:cli-contract
      - name: Input normalization (untrusted document parsers)
        run: npm run test:normalize
      - name: Host provider bounds and invocation building
        run: npm run test:provider
      - name: State compatibility and migration
        run: npm run test:compat
      - name: MCP server transport and profile enforcement
        run: npm run test:mcp
      - name: Project detection and config layering
        run: npm run test:detection
      - name: Development link tooling
        run: npm run test:dev-link
      - name: Verify extracted distributions
        run: npm run verify:dist
      - name: Package release candidates
        run: npm run package:release
      - name: Upload offline validation artifacts
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: agent-sdlc-${{ github.sha }}
          path: |
            release/*
            evals/DETERMINISTIC-VALIDATION.json
            evals/AUTO-ACTIVATION-VALIDATION.json
            evals/VERSION-CONSISTENCY.json
            evals/REGISTRY-VALIDATION.json
            evals/ROOT-SYNC-VALIDATION.json
            evals/GUARD-VALIDATION.json
            evals/CI-COVERAGE-VALIDATION.json
            evals/DEV-LINK-VALIDATION.json
            evals/CLI-CONTRACT-VALIDATION.json
            evals/CLI-SURFACE-VALIDATION.json
            evals/SYNTAX-VALIDATION.json
            evals/REPORT-HYGIENE-VALIDATION.json
            evals/NORMALIZE-VALIDATION.json
            evals/PROVIDER-VALIDATION.json
            evals/COMPAT-VALIDATION.json
            evals/MCP-VALIDATION.json
            evals/PROJECT-DETECTION-VALIDATION.json
          if-no-files-found: warn
          retention-days: 14

  # Windows is a supported development and host platform, and the runtime has
  # platform-sensitive surfaces: path handling (fileURLToPath, drive letters),
  # temp-file + rename durability, and line endings feeding context_hash. The
  # POSIX installer and bootstrap-hook suites stay on the ubuntu job.
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic regression
        run: npm test
      - name: Integrity gates (versions, registry, root sync, host guard, CI coverage, CLI surface)
        run: npm run test:integrity
      - name: Design and plan-quality gates
        run: npm run test:gates
      - name: Task execution engine
        run: npm run test:tasks
      - name: Repository intelligence, traceability, delivery, governance, learning
        run: npm run test:alpha6
      - name: Build provider distributions
        run: npm run build
      - name: CLI contract (spawned binary, agent-facing surface)
        run: npm run test:cli-contract
      - name: Input normalization (untrusted document parsers)
        run: npm run test:normalize
      - name: Host provider bounds and invocation building
        run: npm run test:provider
      - name: State compatibility and migration
        run: npm run test:compat
      - name: MCP server transport and profile enforcement
        run: npm run test:mcp
      - name: Project detection and config layering
        run: npm run test:detection
      - name: Development link tooling
        run: npm run test:dev-link
      - name: Verify extracted distributions
        run: npm run verify:dist

  # test:coverage re-runs every offline-validation/windows-validation subject
  # suite a second time under NODE_V8_COVERAGE (none of them need a built
  # package, and nothing downstream reads evals/COVERAGE.json), so it ran in
  # this same job it was measuring after those suites already ran once for
  # pass/fail -- the longest segment of the run, on every leg that measured
  # it. Its own dedicated job runs in parallel with both from the start
  # instead of serially at the tail of either. One measurement per OS, not
  # per Node version too: evals/COVERAGE-FLOOR.json's floor only distinguishes
  # ubuntu from Windows (several cases SKIP on ubuntu), so a second ubuntu
  # measurement under Node 18 added cost without a distinct signal.
  # scripts/validate-ci-coverage.mjs checks this suite against this job by
  # name (ALTERNATE_JOB), not against offline-validation.
  coverage-floor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime coverage floor
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-sdlc-coverage-${{ matrix.os }}-${{ github.sha }}
          path: evals/COVERAGE.json
          if-no-files-found: warn
          retention-days: 14
